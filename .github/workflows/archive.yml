name: Archive IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

concurrency:
  group: archive-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  archive:
    name: Archive & Export IPA (Unsigned + Optional Signed)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_16.4.app ]]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [[ -d /Applications/Xcode_16.3.app ]]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          elif [[ -d /Applications/Xcode_16.2.app ]]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [[ -d /Applications/Xcode_16.1.app ]]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [[ -d /Applications/Xcode_16.0.app ]]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [[ -d /Applications/Xcode_15.4.app ]]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen || true

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d Quicksilver.xcodeproj

      - name: Check signing secrets
        id: signing
        run: |
          if [[ -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" && -n "${{ secrets.P12_PASSWORD }}" && -n "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets detected — will also produce signed IPA."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets. Will produce unsigned IPA for SideStore re-signing."
          fi

      - name: Install signing certificate & profile
        if: steps.signing.outputs.available == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          security create-keychain -p "${KEYCHAIN_PASSWORD:-temporary}" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD:-temporary}" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build (unsigned path)
        id: build
        run: |
          set -euo pipefail
          mkdir -p build/unsigned

          # Force device architecture build with signing completely disabled
          xcodebuild \
            -project Quicksilver.xcodeproj \
            -scheme Quicksilver \
            -configuration ${{ inputs.configuration }} \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build \
            2>&1 | tee build-unsigned.log

          # Locate the built .app
          APP_PATH=$(find DerivedData -name "Quicksilver.app" -type d | head -n 1)
          if [[ -z "$APP_PATH" ]]; then
            echo "::error::Could not find Quicksilver.app after build"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

          # Package as unsigned IPA (SideStore can re-sign this)
          mkdir -p build/unsigned/Payload
          cp -R "$APP_PATH" build/unsigned/Payload/
          cd build/unsigned
          zip -r ../Quicksilver-unsigned.ipa Payload
          cd ../..
          ls -lh build/Quicksilver-unsigned.ipa
          echo "Unsigned IPA created successfully."

      - name: Archive + Export signed IPA (optional)
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project Quicksilver.xcodeproj \
            -scheme Quicksilver \
            -configuration ${{ inputs.configuration }} \
            -destination "generic/platform=iOS" \
            -archivePath build/Quicksilver.xcarchive \
            -derivedDataPath DerivedData-Signed \
            archive \
            2>&1 | tee archive-signed.log

          cat > build/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>${{ secrets.TEAM_ID }}</string>
            <key>compileBitcode</key>
            <false/>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/Quicksilver.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa \
            2>&1 | tee export-signed.log
          ls -la build/ipa || true

      - name: Upload unsigned IPA (always)
        uses: actions/upload-artifact@v4
        with:
          name: Quicksilver-unsigned-IPA
          path: build/Quicksilver-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Upload signed IPA (if available)
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Quicksilver-signed-IPA
          path: build/ipa/*.ipa
          retention-days: 14
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-unsigned.log
            archive-signed.log
            export-signed.log
            build/
          retention-days: 7
          if-no-files-found: ignore
