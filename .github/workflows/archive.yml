name: Archive IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

concurrency:
  group: archive-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  archive:
    name: Archive & Export IPA (Unsigned + Optional Signed)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          echo "Available Xcode apps:"
          ls /Applications | grep -i xcode || true

          SELECTED=""
          for candidate in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app \
            /Applications/Xcode_16.1.app \
            /Applications/Xcode_16.0.app \
            /Applications/Xcode_15.4.app \
            /Applications/Xcode.app
          do
            if [[ -d "$candidate" ]]; then
              SELECTED="$candidate"
              break
            fi
          done

          if [[ -z "$SELECTED" ]]; then
            echo "::error::No usable Xcode installation found on runner"
            exit 1
          fi

          sudo xcode-select -s "$SELECTED"
          echo "Selected: $(xcode-select -p)"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen || true

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d Quicksilver.xcodeproj
          echo "Project generated successfully."

      - name: Check signing secrets
        id: signing
        run: |
          if [[ -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" && -n "${{ secrets.P12_PASSWORD }}" && -n "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets detected — will also produce signed IPA."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets. Will produce unsigned IPA for SideStore re-signing."
          fi

      - name: Install signing certificate & profile
        if: steps.signing.outputs.available == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          security create-keychain -p "${KEYCHAIN_PASSWORD:-temporary}" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD:-temporary}" "$KEYCHAIN_PATH"
          # -t agg imports both the certificate and its private key; -t cert alone drops the
          # private key and codesign then fails with "no identity found".
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t agg -f pkcs12 \
            -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          # Allow codesign to use the key without an interactive keychain prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD:-temporary}" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build (unsigned path)
        id: build
        run: |
          set -euo pipefail
          mkdir -p build/unsigned

          xcodebuild \
            -project Quicksilver.xcodeproj \
            -scheme Quicksilver \
            -configuration ${{ inputs.configuration }} \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build \
            2>&1 | tee build-unsigned.log

          APP_PATH=$(find DerivedData -name "Quicksilver.app" -type d | head -n 1)
          if [[ -z "$APP_PATH" ]]; then
            echo "::error::Could not find Quicksilver.app after build"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

          # --- SideStore critical: verify persona prompts are embedded ---
          echo "Verifying persona prompt resources…"
          for persona in quicksilver forge eternal; do
            if [[ -f "$APP_PATH/Personas/${persona}.txt" ]] || [[ -f "$APP_PATH/${persona}.txt" ]]; then
              echo "  OK  ${persona}.txt present"
            else
              # Also check Resources subfolder layouts that Xcode sometimes uses
              FOUND=$(find "$APP_PATH" -name "${persona}.txt" | head -n 1 || true)
              if [[ -n "$FOUND" ]]; then
                echo "  OK  ${persona}.txt found at $FOUND"
              else
                echo "::warning::Persona prompt ${persona}.txt not found inside app bundle — PromptManager will use embedded fallback"
              fi
            fi
          done

          # Verify Privacy Manifest if present
          if [[ -f "$APP_PATH/PrivacyInfo.xcprivacy" ]]; then
            echo "  OK  PrivacyInfo.xcprivacy present"
          else
            echo "::warning::PrivacyInfo.xcprivacy not found in app bundle"
          fi

          # Package as unsigned IPA (SideStore can re-sign this)
          mkdir -p build/unsigned/Payload
          cp -R "$APP_PATH" build/unsigned/Payload/
          cd build/unsigned
          zip -r ../Quicksilver-unsigned.ipa Payload
          cd ../..
          ls -lh build/Quicksilver-unsigned.ipa

          # Basic IPA structure check
          unzip -l build/Quicksilver-unsigned.ipa | grep -q "Payload/Quicksilver.app" || {
            echo "::error::IPA does not contain Payload/Quicksilver.app"
            exit 1
          }
          echo "Unsigned IPA created and structure verified."

      - name: Archive + Export signed IPA (optional)
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project Quicksilver.xcodeproj \
            -scheme Quicksilver \
            -configuration ${{ inputs.configuration }} \
            -destination "generic/platform=iOS" \
            -archivePath build/Quicksilver.xcarchive \
            -derivedDataPath DerivedData-Signed \
            archive \
            2>&1 | tee archive-signed.log

          cat > build/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>${{ secrets.TEAM_ID }}</string>
            <key>compileBitcode</key>
            <false/>
            <!-- project.yml sets CODE_SIGN_STYLE: Automatic; manual export would require an
                 explicit provisioningProfiles map and fails without one. -->
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/Quicksilver.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates \
            2>&1 | tee export-signed.log
          ls -la build/ipa || true

      - name: Upload unsigned IPA (always)
        uses: actions/upload-artifact@v4
        with:
          name: Quicksilver-unsigned-IPA
          path: build/Quicksilver-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Upload signed IPA (if available)
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Quicksilver-signed-IPA
          path: build/ipa/*.ipa
          retention-days: 14
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-unsigned.log
            archive-signed.log
            export-signed.log
            build/
          retention-days: 7
          if-no-files-found: ignore
